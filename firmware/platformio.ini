; Build with PlatformIO:  pio run -t upload   (then: pio device monitor)
;
; Wifi, API URL and bin id are NOT set here — they come from the repo-root
; .env (WIFI_SSID, WIFI_PASSWORD, PUBLIC_API_URL, DEVICE_SLUG, ...) via
; load_env.py, so you only ever edit that one file.
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:load_env.py

lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.13
    adafruit/Adafruit GFX Library @ ^1.11.11
    adafruit/Adafruit ADXL345 @ ^1.3.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
