<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Collection forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* Colour tokens copied from frontend/app/globals.css so this page looks
     like part of the main dashboard. Keep them in sync if those change. */
  :root {
    --background: 40 18% 95%;
    --foreground: 20 14% 4%;
    --card: 40 25% 99%;
    --muted: 40 14% 91%;
    --muted-foreground: 25 8% 42%;
    --primary: 142 71% 27%;
    --border: 30 12% 86%;
    --status-good: 142 65% 32%;
    --status-warning: 32 92% 46%;
    --status-critical: 2 72% 48%;
    --radius: 0.625rem;
    --shadow-color: 30 25% 12%;
  }
  :root[data-theme="dark"] {
    --background: 20 16% 7%;
    --foreground: 40 10% 96%;
    --card: 20 15% 10%;
    --muted: 20 10% 15%;
    --muted-foreground: 30 8% 63%;
    --primary: 142 55% 48%;
    --border: 20 10% 19%;
    --status-good: 142 55% 46%;
    --status-warning: 36 90% 58%;
    --status-critical: 2 72% 58%;
    --shadow-color: 0 0% 0%;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    background: hsl(var(--background));
    color: hsl(var(--foreground));
    font-family: Inter, system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1040px; margin: 0 auto; }

  header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
  h1 {
    margin: 0;
    font-family: "Space Grotesk", Inter, system-ui, sans-serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .lede { margin: 4px 0 0; color: hsl(var(--muted-foreground)); }

  .controls { display: flex; align-items: center; gap: 12px; color: hsl(var(--muted-foreground)); font-size: 13px; }
  select {
    font: inherit;
    color: hsl(var(--foreground));
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border));
    border-radius: calc(var(--radius) - 2px);
    padding: 6px 8px;
  }
  select:focus-visible { outline: 2px solid hsl(var(--primary)); outline-offset: 2px; }

  .notice {
    margin-top: 16px;
    padding: 10px 14px;
    border-radius: var(--radius);
    background: hsl(var(--status-critical) / 0.1);
    color: hsl(var(--status-critical));
    font-weight: 500;
  }

  #bins { margin-top: 24px; display: grid; gap: 16px; }
  .bin {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 24px;
    padding: 20px;
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border) / 0.6);
    border-radius: var(--radius);
    box-shadow: 0 1px 2px hsl(var(--shadow-color) / 0.04), 0 10px 24px -12px hsl(var(--shadow-color) / 0.16);
  }
  @media (max-width: 720px) {
    body { padding: 16px; }
    .bin { grid-template-columns: 1fr; gap: 12px; }
  }

  .bin h2 { margin: 0; font-size: 14px; font-weight: 500; color: hsl(var(--muted-foreground)); }
  .headline {
    margin: 6px 0 0;
    font-family: "Space Grotesk", Inter, system-ui, sans-serif;
    font-size: 28px;
    font-weight: 600;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .headline .time { font-family: "JetBrains Mono", ui-monospace, monospace; font-weight: 500; white-space: nowrap; }
  .detail { margin: 8px 0 0; color: hsl(var(--muted-foreground)); }
  .detail .num { font-family: "JetBrains Mono", ui-monospace, monospace; color: hsl(var(--foreground)); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.soon { background: hsl(var(--status-warning) / 0.14); color: hsl(var(--status-warning)); }
  .badge.now { background: hsl(var(--status-critical) / 0.12); color: hsl(var(--status-critical)); }
  .badge.fine { background: hsl(var(--status-good) / 0.12); color: hsl(var(--status-good)); }
  .badge.wait { background: hsl(var(--muted)); color: hsl(var(--muted-foreground)); }

  svg { display: block; width: 100%; height: auto; }
  .axis { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10px; fill: hsl(var(--muted-foreground)); }
  .grid { stroke: hsl(var(--border)); stroke-width: 1; }
  .threshold { stroke: hsl(var(--status-critical)); stroke-width: 1; stroke-dasharray: 4 4; }
  .threshold-label { font-family: Inter, system-ui, sans-serif; font-size: 10px; font-weight: 500; fill: hsl(var(--status-critical)); }
  .history { fill: none; stroke: hsl(var(--primary)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .history-area { fill: hsl(var(--primary) / 0.08); }
  .band { fill: hsl(var(--status-warning) / 0.18); }
  .median { stroke: hsl(var(--status-warning)); stroke-width: 2; stroke-dasharray: 5 4; stroke-linecap: round; }
  .now-dot { fill: hsl(var(--primary)); stroke: hsl(var(--card)); stroke-width: 2; }
  .hit-dot { fill: hsl(var(--status-warning)); stroke: hsl(var(--card)); stroke-width: 2; }

  .key { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 8px; font-size: 12px; color: hsl(var(--muted-foreground)); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { display: inline-block; width: 16px; height: 0; border-top: 2px solid; }
  .key .k-history { border-color: hsl(var(--primary)); }
  .key .k-median { border-color: hsl(var(--status-warning)); border-top-style: dashed; }
  .key .k-band { height: 8px; border: 0; background: hsl(var(--status-warning) / 0.3); border-radius: 2px; }

  footer { margin-top: 20px; color: hsl(var(--muted-foreground)); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Collection forecast</h1>
      <p class="lede">When each bin will reach its collection threshold, so a truck can get there first.</p>
    </div>
    <div class="controls">
      <label for="lead">Flag bins due within</label>
      <select id="lead">
        <option value="0.0833">5 minutes</option>
        <option value="0.25">15 minutes</option>
        <option value="1">1 hour</option>
        <option value="2" selected>2 hours</option>
        <option value="6">6 hours</option>
      </select>
    </div>
  </header>

  <div id="notice" class="notice" role="status" hidden></div>
  <div id="bins" aria-live="polite"></div>
  <footer id="updated"></footer>
</main>

<script>
(function () {
  "use strict";

  var REFRESH_MS = 5000;
  var MIN_READINGS = 9;   // the model needs 8 intervals, so 9 readings
  var W = 640, H = 230, M = { l: 34, r: 14, t: 14, b: 24 };

  // Follow the main dashboard's theme when embedded (?theme=dark), else the device setting.
  var params = new URLSearchParams(location.search);
  var theme = params.get("theme") ||
    (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.setAttribute("data-theme", theme);
  if (params.get("leadHours")) {
    var sel = document.getElementById("lead");
    var custom = document.createElement("option");
    custom.value = params.get("leadHours");
    custom.textContent = params.get("leadHours") + " hours";
    custom.selected = true;
    sel.appendChild(custom);
  }

  function esc(text) {
    return String(text).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function clock(ms) {
    return new Date(ms).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", hour12: false });
  }
  function span(ms) {
    var mins = Math.round(ms / 60000);
    if (mins < 1) return "under a minute";
    if (mins < 60) return mins + " min";
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + " h" + (m ? " " + m + " min" : "");
  }

  function chart(bin) {
    var pts = bin.history.map(function (p) { return { t: Date.parse(p.ts), v: p.fillPct }; });
    if (pts.length < 2) return "";
    var first = pts[0], last = pts[pts.length - 1];
    var ok = bin.status === "ok";
    var tMid = ok ? Date.parse(bin.predictedFullAt) : null;
    var tLow = ok ? Date.parse(bin.earliestFullAt) : null;
    var tHigh = ok ? Date.parse(bin.latestFullAt) : null;

    // Don't let a very uncertain late end squash the rest of the chart.
    var tEnd = ok
      ? Math.min(tHigh, last.t + 3 * (tMid - last.t))
      : last.t + 0.15 * (last.t - first.t);
    tEnd += 0.04 * (tEnd - first.t);

    var x = function (t) { return M.l + (t - first.t) / (tEnd - first.t) * (W - M.l - M.r); };
    var y = function (v) { return M.t + (100 - Math.max(0, Math.min(100, v))) / 100 * (H - M.t - M.b); };
    var out = [];

    [0, 25, 50, 75, 100].forEach(function (v) {
      out.push('<line class="grid" x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>');
      out.push('<text class="axis" x="' + (M.l - 6) + '" y="' + (y(v) + 3) + '" text-anchor="end">' + v + '</text>');
    });
    for (var i = 0; i <= 4; i++) {
      var t = first.t + (tEnd - first.t) * i / 4;
      var anchor = i === 0 ? "start" : i === 4 ? "end" : "middle";
      out.push('<text class="axis" x="' + x(t) + '" y="' + (H - 6) + '" text-anchor="' + anchor + '">' + clock(t) + '</text>');
    }

    var thr = bin.thresholdPct;
    out.push('<line class="threshold" x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + y(thr) + '" y2="' + y(thr) + '"/>');
    out.push('<text class="threshold-label" x="' + (M.l + 4) + '" y="' + (y(thr) - 5) + '">Collect at ' + Math.round(thr) + '%</text>');

    var line = pts.map(function (p) { return x(p.t).toFixed(1) + "," + y(p.v).toFixed(1); }).join(" ");
    out.push('<polygon class="history-area" points="' + x(first.t) + "," + y(0) + " " + line + " " + x(last.t) + "," + y(0) + '"/>');
    out.push('<polyline class="history" points="' + line + '"/>');

    if (ok) {
      var hi = Math.min(tHigh, tEnd);
      out.push('<polygon class="band" points="' +
        x(last.t) + "," + y(last.v) + " " + x(tLow) + "," + y(thr) + " " + x(hi) + "," + y(thr) + '"/>');
      out.push('<line class="median" x1="' + x(last.t) + '" y1="' + y(last.v) + '" x2="' + x(tMid) + '" y2="' + y(thr) + '"/>');
      out.push('<circle class="hit-dot" cx="' + x(tMid) + '" cy="' + y(thr) + '" r="4.5"/>');
    }
    out.push('<circle class="now-dot" cx="' + x(last.t) + '" cy="' + y(last.v) + '" r="4.5"/>');

    var label = ok
      ? "Fill level history, with a forecast reaching " + Math.round(thr) + "% around " + clock(tMid)
      : "Fill level history";
    return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(bin.label + ". " + label) + '">' +
      out.join("") + "</svg>";
  }

  function summary(bin) {
    var last = bin.history.length ? bin.history[bin.history.length - 1] : null;
    var fill = last ? '<span class="num">' + Math.round(last.fillPct) + "%</span> full now" : "";
    var thr = Math.round(bin.thresholdPct);

    if (bin.status === "ok") {
      var early = Date.parse(bin.earliestFullAt);
      var wait = early - Date.now();
      var when = wait > 0 ? "in " + span(wait) : "overdue";
      return {
        headline: 'Collect by <span class="time">' + clock(early) + "</span>",
        detail: fill + ", " + when + ". Expected to reach " + thr + '% at <span class="num">' +
          clock(Date.parse(bin.predictedFullAt)) + '</span>, between <span class="num">' + clock(early) +
          '</span> and <span class="num">' + clock(Date.parse(bin.latestFullAt)) + "</span>.",
        badge: bin.collectSoon ? ["soon", "Collect soon"] : ["fine", "On track"]
      };
    }
    if (bin.status === "at_threshold") {
      return {
        headline: "Collect now",
        detail: fill + ", past the " + thr + "% collection threshold.",
        badge: ["now", "Needs collection"]
      };
    }
    if (bin.status === "not_filling") {
      return {
        headline: "No collection needed yet",
        detail: fill + ". The fill level isn't rising, so there is nothing to forecast.",
        badge: ["fine", "Not filling"]
      };
    }
    var have = bin.history.length;
    return {
      headline: "Gathering readings",
      detail: (fill ? fill + ". " : "") + "A forecast appears after " + MIN_READINGS +
        ' readings since the bin was last emptied. This bin has <span class="num">' + have + "</span> stored.",
      badge: ["wait", "No forecast yet"]
    };
  }

  // Most urgent first: already at the threshold, then by earliest time, then the rest.
  function urgency(bin) {
    if (bin.status === "at_threshold") return 0;
    if (bin.status === "ok") return Date.parse(bin.earliestFullAt);
    return Infinity;
  }

  function render(bins) {
    bins.sort(function (a, b) { return urgency(a) - urgency(b); });
    var html = bins.map(function (bin) {
      var s = summary(bin);
      var key = bin.status === "ok"
        ? '<div class="key"><span><i class="k-history"></i>Measured fill</span>' +
          '<span><i class="k-median"></i>Forecast</span>' +
          '<span><i class="k-band"></i>80% range</span></div>'
        : "";
      return '<section class="bin"><div>' +
        "<h2>" + esc(bin.label) + "</h2>" +
        '<p class="headline">' + s.headline + "</p>" +
        '<p class="detail">' + s.detail + "</p>" +
        '<span class="badge ' + s.badge[0] + '">' + s.badge[1] + "</span>" +
        "</div><div>" + chart(bin) + key + "</div></section>";
    }).join("");
    document.getElementById("bins").innerHTML = html ||
      '<p class="lede">No bins are registered yet. Add one to DEVICE_REGISTRY in the backend config.</p>';
  }

  var notice = document.getElementById("notice");
  function refresh() {
    var lead = document.getElementById("lead").value;
    fetch("/forecast/series?leadHours=" + encodeURIComponent(lead))
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (bins) {
        notice.hidden = true;
        render(bins);
        document.getElementById("updated").textContent =
          "Updated " + new Date().toLocaleTimeString([], { hour12: false }) + ". Refreshes every " + REFRESH_MS / 1000 +
          " seconds. Forecast: Bayesian regression of fill gained against time and visits.";
      })
      .catch(function () {
        notice.hidden = false;
        notice.textContent = "Can't reach the forecast service. Check it is running on this address. Retrying.";
      });
  }

  document.getElementById("lead").addEventListener("change", refresh);
  refresh();
  setInterval(refresh, REFRESH_MS);
})();
</script>
</body>
</html>
